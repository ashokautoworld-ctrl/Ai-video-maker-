<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Lyrics Maker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header>
      <h1>🎵 AI Lyrics Maker</h1>
      <p>Create original songs with AI</p>
    </header>

    <section class="card">

      <label>Song Topic / Story</label>

      <textarea
        id="topic"
        placeholder="Example: One-sided love, she left me without explanation..."
      ></textarea>

      <div class="row">

        <div>
          <label>Mood</label>
          <select id="mood">
            <option>Romantic</option>
            <option>Sad</option>
            <option>Breakup</option>
            <option>Love</option>
            <option>Emotional</option>
            <option>Qawali</option>
          </select>
        </div>

        <div>
          <label>Singer</label>
          <select id="singer">
            <option>Male</option>
            <option>Female</option>
            <option>Duet</option>
          </select>
        </div>

      </div>

      <div class="row">

        <div>
          <label>Language</label>
          <select id="language">
            <option>Hindi</option>
            <option>Urdu</option>
            <option>Marathi</option>
          </select>
        </div>

        <div>
          <label>Song Length</label>
          <select id="length">
            <option>Short</option>
            <option>Medium</option>
            <option>Full Song</option>
          </select>
        </div>

      </div>

      <button id="generateBtn" class="generate">
        ✨ Generate Lyrics
      </button>

      <div id="status"></div>

    </section>


    <section class="card">

      <label>Generated Lyrics</label>

      <textarea
        id="lyrics"
        class="lyrics-box"
        placeholder="Your generated lyrics will appear here..."
      ></textarea>

      <button id="copyBtn" class="copy">
        📋 Copy Lyrics
      </button>

      <button id="saveBtn" class="save">
        💾 Save Lyrics
      </button>

    </section>


    <section class="card projects">

      <h2>📁 My Lyrics</h2>

      <div id="projectList">
        <p class="empty">No lyrics saved yet.</p>
      </div>

    </section>

  </div>

  <script src="app.js"></script>

</body>
</html>
